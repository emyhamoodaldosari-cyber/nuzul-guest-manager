name: Build Android preview APK
# A manual build; no Expo account or Expo token is required.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci
      - run: npm run check
      - name: Generate native project with SQLCipher
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone preview APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: nuzul-android-preview
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
